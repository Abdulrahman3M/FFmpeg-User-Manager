name: tests
# Runs the full test suite on a real Windows runner under BOTH Windows PowerShell 5.1 and PowerShell 7.
# It only reads the repository and reports results; it never pushes, merges or publishes anything.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (needed by the tests)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg diagnostics
        shell: pwsh
        run: |
          ffmpeg -version | Select-Object -First 2
          (ffmpeg -hide_banner -filters | Select-String 'afftdn|loudnorm|silenceremove') | ForEach-Object { $_.Line }
          'filter count: ' + @(ffmpeg -hide_banner -filters).Count
      - name: Run the full suite (${{ matrix.shell }})
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1 > suite.log 2>&1
      - name: Failure summary
        if: always()
        shell: pwsh
        run: |
          $diag = @'
          . .\src\Import-Modules.ps1
          $c = Get-FFCapabilities
          'caps: enc={0} filt={1} mux={2}' -f $c.Encoders.Count, $c.Filters.Count, $c.Muxers.Count
          foreach ($f in 'afftdn','loudnorm','silenceremove','palettegen','paletteuse','subtitles','rotate','showwaves') { '{0} filter: {1}' -f $f, (Test-FFFilter $f) }
          foreach ($e in 'libx264','libx265','libmp3lame','gif') { '{0} encoder: {1}' -f $e, (Test-FFEncoder $e) }
          '@
          Set-Content -Path diag.ps1 -Value $diag
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File diag.ps1 2>&1 | Select-Object -First 25
          Select-String -Path suite.log -Pattern '^FAIL:|SUMMARY' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(200, $_.Line.Length)) }
