name: tests
# Runs the full test suite on a real Windows runner under BOTH Windows PowerShell 5.1 and PowerShell 7.
# It only reads the repository and reports results; it never pushes, merges or publishes anything.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (needed by the tests)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg diagnostics
        shell: pwsh
        run: |
          ffmpeg -version | Select-Object -First 2
          (ffmpeg -hide_banner -filters | Select-String 'afftdn|loudnorm|silenceremove') | ForEach-Object { $_.Line }
          'filter count: ' + @(ffmpeg -hide_banner -filters).Count
      - name: Run the full suite (${{ matrix.shell }})
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1 > suite.log 2>&1
      - name: Failure summary
        if: always()
        shell: pwsh
        run: |
          Select-String -Path suite.log -Pattern '^FAIL:|SUMMARY' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) }
          Select-String -Path suite.log -Pattern '^\s+\[FAIL\]' -Context 0,4 | ForEach-Object { $_.Line; $_.Context.PostContext | ForEach-Object { '    ' + $_.Substring(0, [Math]::Min(250, $_.Length)) } } | Select-Object -First 90
