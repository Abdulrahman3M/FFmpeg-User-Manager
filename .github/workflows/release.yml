name: release
# Manual only. A maintainer must confirm the exact manifest-pinned GPL-3.0 FFmpeg package before acquisition.
# This workflow is not run automatically for pushes or pull requests.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; it must match the canonical VERSION file.'
        required: true
        type: string
      confirm_ffmpeg_acquisition:
        description: 'Authorize WinGet to download the manifest-pinned Gyan.FFmpeg.Shared x64 GPL-3.0 package for the Full Edition.'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Check version, explicit runtime acquisition consent, and release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFIRM_FFMPEG_ACQUISITION: ${{ inputs.confirm_ffmpeg_acquisition }}
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:RELEASE_VERSION) { throw "VERSION is '$v' but '$env:RELEASE_VERSION' was requested" }
          if ($env:CONFIRM_FFMPEG_ACQUISITION -ne 'true') { throw 'The maintainer must explicitly confirm the pinned GPL-3.0 FFmpeg package acquisition.' }
          if (-not (Test-Path "docs/Release-Notes-v$v.md")) { throw "docs/Release-Notes-v$v.md is missing" }
          git fetch --tags --quiet
          if (git tag --list "v$v") { throw "tag v$v already exists" }
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Full and Lite packages with Windows PowerShell 5.1
        shell: powershell
        run: .\tools\New-ReleasePackage.ps1 -OutputDirectory dist -Edition Both -AcquireFFmpeg
      - name: Verify packages, checksums, Unicode/spaced extraction, and bundled runtimes
        shell: pwsh
        run: |
          $version = $env:VER
          $revision = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $fullZip = Join-Path 'dist' "FFmpeg-User-Manager-v$version-Full-Windows-x64.zip"
          $liteZip = Join-Path 'dist' "FFmpeg-User-Manager-v$version-Lite-Windows-x64.zip"
          $sums = Join-Path 'dist' "SHA256SUMS-v$version.txt"
          foreach ($path in @($fullZip, $liteZip, $sums)) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release artifact: $path" } }
          $lines = @(Get-Content -LiteralPath $sums)
          if ($lines.Count -ne 2) { throw 'The checksum manifest must contain exactly the Full and Lite packages.' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'dist' $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Read-ZipEntryText([string]$ZipPath, [string]$EntryName) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $ZipPath))
            try {
              $entry = $archive.GetEntry($EntryName)
              if (-not $entry) { throw "Missing $EntryName in $ZipPath" }
              $stream = $entry.Open(); $reader = New-Object System.IO.StreamReader($stream)
              try { return $reader.ReadToEnd() } finally { $reader.Dispose(); $stream.Dispose() }
            } finally { $archive.Dispose() }
          }
          $fullBuild = Read-ZipEntryText $fullZip 'FFmpeg-User-Manager/BUILD-INFO.txt'
          $liteBuild = Read-ZipEntryText $liteZip 'FFmpeg-User-Manager/BUILD-INFO.txt'
          $fullFFmpegSource = Read-ZipEntryText $fullZip 'FFmpeg-User-Manager/External-Libraries/FFmpeg/SOURCE.txt'
          $manifest = Get-Content -LiteralPath 'External-Libraries/manifest.json' -Raw | ConvertFrom-Json
          $ffmpegDefinition = @($manifest.Libraries | Where-Object { $_.Id -eq 'ffmpeg' }) | Select-Object -First 1
          if (-not $ffmpegDefinition) { throw 'The canonical FFmpeg runtime definition is missing.' }
          if ($fullFFmpegSource -notmatch ('(?m)^UpstreamSourceRevision: ' + [regex]::Escape([string]$ffmpegDefinition.UpstreamSourceRevision) + '\r?$')) { throw 'Full package corresponding-source revision is missing or stale.' }
          foreach ($requiredFlag in @($ffmpegDefinition.RequiredBuildFlags)) { if ($fullFFmpegSource -notmatch [regex]::Escape([string]$requiredFlag)) { throw ('Full package build metadata is missing a manifest-required flag: ' + [string]$requiredFlag) } }
          if ($fullBuild -notmatch "(?m)^Version: $([regex]::Escape($version))\r?$") { throw 'Full package version metadata is stale.' }
          if ($liteBuild -notmatch "(?m)^Version: $([regex]::Escape($version))\r?$") { throw 'Lite package version metadata is stale.' }
          if ($fullBuild -notmatch "(?m)^SourceRevision: $([regex]::Escape($revision))\r?$") { throw 'Full package source revision does not match this checkout.' }
          if ($liteBuild -notmatch "(?m)^SourceRevision: $([regex]::Escape($revision))\r?$") { throw 'Lite package source revision does not match this checkout.' }
          $fullArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $fullZip))
          $liteArchive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $liteZip))
          try {
            $fullNames = @($fullArchive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            $liteNames = @($liteArchive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            foreach ($required in @('FFmpeg-User-Manager/THIRD-PARTY-NOTICES.md', 'FFmpeg-User-Manager/External-Libraries/manifest.json', 'FFmpeg-User-Manager/External-Libraries/FFmpeg/bin/ffmpeg.exe', 'FFmpeg-User-Manager/External-Libraries/FFmpeg/bin/ffprobe.exe', 'FFmpeg-User-Manager/External-Libraries/FFmpeg/LICENSES/COPYING.GPLv3', 'FFmpeg-User-Manager/External-Libraries/FFmpeg/SOURCE.txt', 'FFmpeg-User-Manager/External-Libraries/Assimp/bin/assimp.exe', 'FFmpeg-User-Manager/External-Libraries/Assimp/licenses/assimp/LICENSE')) {
              if ($fullNames -notcontains $required) { throw "Full package is missing required runtime or legal file: $required" }
            }
            if ($liteNames -notcontains 'FFmpeg-User-Manager/THIRD-PARTY-NOTICES.md') { throw 'Lite package is missing the third-party runtime notice.' }
            if (@($liteNames | Where-Object { $_ -match 'External-Libraries/(FFmpeg|Assimp)/.*\.(exe|dll)$' }).Count -gt 0) { throw 'Lite package contains an external runtime binary.' }
            foreach ($names in @($fullNames, $liteNames)) {
              if (@($names | Where-Object { $_ -match '(^|/)(\.git|tests|tools|dist|\.superpowers|\.cache|\.stage[^/]*)(/|$)' }).Count -gt 0) { throw 'A package contains development, cache or staging content.' }
            }
          } finally { $fullArchive.Dispose(); $liteArchive.Dispose() }
          $extractBase = Join-Path $env:RUNNER_TEMP ('FFmpeg User Manager ' + [char]0x03A9 + ' (package smoke) ' + [guid]::NewGuid().ToString('N'))
          $fullRoot = Join-Path $extractBase 'Full'
          $liteRoot = Join-Path $extractBase 'Lite'
          Expand-Archive -LiteralPath $fullZip -DestinationPath $fullRoot
          Expand-Archive -LiteralPath $liteZip -DestinationPath $liteRoot
          $fullApp = Join-Path $fullRoot 'FFmpeg-User-Manager'
          $liteApp = Join-Path $liteRoot 'FFmpeg-User-Manager'
          $fullVersion = & pwsh -NoProfile -File (Join-Path $fullApp 'Start-FFmpegTUI.ps1') -Version
          $liteVersion = & powershell -NoProfile -File (Join-Path $liteApp 'Start-FFmpegTUI.ps1') -Version
          if ("$fullVersion" -notmatch [regex]::Escape($version) -or "$liteVersion" -notmatch [regex]::Escape($version)) { throw 'An extracted package did not report the expected app version.' }
          . (Join-Path (Join-Path $fullApp 'src') 'Import-Modules.ps1')
          Import-FFTuiModules -Root $fullApp
          Set-AppRoot -Path $fullApp
          $runtime = Find-FFmpegInstallation
          if ($runtime.Status -ne 'Ready' -or $runtime.Source -ne 'Bundled') { throw "Extracted Full package did not resolve bundled FFmpeg: $($runtime.Status) / $($runtime.Source)" }
          $requirements = Test-FFmpegRuntimeRequirements -FfmpegPath $runtime.Ffmpeg -FfprobePath $runtime.Ffprobe -Source Bundled -ExpectedVersion ([string]$ffmpegDefinition.CurrentVersion)
          if (-not $requirements.Ready) { throw "Extracted Full FFmpeg self-check failed: $($requirements.Detail)" }
          $assimp = Get-ThreeDToolStatus
          if (-not $assimp.Available) { throw "Extracted Full Assimp check failed: $($assimp.Reason)" }
          $modelRoot = Join-Path $extractBase ('model ' + [char]0x03A9 + ' (OBJ to GLB)')
          [void](New-Item -ItemType Directory -Path $modelRoot -Force)
          $objPath = Join-Path $modelRoot ('triangle ' + [char]0x03A9 + '.obj')
          $glbPath = Join-Path $modelRoot ('triangle output ' + [char]0x03A9 + '.glb')
          [System.IO.File]::WriteAllText($objPath, "v 0 0 0`nv 1 0 0`nv 0 1 0`nvt 0 0`nvt 1 0`nvt 0 1`nvn 0 0 1`nf 1/1/1 2/2/1 3/3/1`n", (New-Object System.Text.UTF8Encoding($false)))
          $assimpArgs = @(New-AssimpExportArguments -InputPath $objPath -OutputPath $glbPath)
          $conversion = Invoke-ExternalCapture -FilePath $assimp.Path -Arguments $assimpArgs -TimeoutSec 120
          if (-not $conversion.Started -or $conversion.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $glbPath -PathType Leaf) -or (Get-Item -LiteralPath $glbPath).Length -le 0) { throw 'The extracted Unicode/spaced-path OBJ to GLB smoke test failed.' }
          Write-Host ('Full package FFmpeg version: ' + $runtime.Version)
          Write-Host ('Full package Assimp path: ' + $assimp.Path)
          Write-Host ('Full and Lite extracted versions: ' + "$fullVersion" + ' / ' + "$liteVersion")
      - name: Create the annotated tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$env:VER" -m "FFmpeg User Manager v$env:VER"
          git push origin "v$env:VER"
          $sums = "dist/SHA256SUMS-v$env:VER.txt"
          $full = "dist/FFmpeg-User-Manager-v$env:VER-Full-Windows-x64.zip"
          $lite = "dist/FFmpeg-User-Manager-v$env:VER-Lite-Windows-x64.zip"
          gh release create "v$env:VER" $full $lite $sums --title "FFmpeg User Manager v$env:VER" --notes-file "docs/Release-Notes-v$env:VER.md" --verify-tag
          gh release view "v$env:VER" --json tagName,url,assets --jq '.tagName, .url, (.assets[].name)'
