name: skill-check
# Temporary verification of the PowerShell TUI Application Designer skill package on Windows (both PowerShell editions) and Linux. Not for merging.
on:
  push:
    branches: ['ci/skill-check']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Skill self-check (${{ matrix.shell }})
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File "skill-check\PowerShell TUI Application Designer\Scripts\Test-SkillPackage.ps1" > skill.log 2>&1
      - name: Result
        if: always()
        shell: pwsh
        run: Get-Content skill.log -Encoding UTF8 | Select-Object -Last 60
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill self-check (pwsh on Linux)
        shell: bash
        run: pwsh -NoProfile -File "skill-check/PowerShell TUI Application Designer/Scripts/Test-SkillPackage.ps1" | tail -60
